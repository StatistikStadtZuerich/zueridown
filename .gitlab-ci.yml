include:
  # use template for gitlab pipeline to check and build
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "feature-build-pkgdown"
    file: "r-check-and-build-packages.yml"
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "main"
    file: "publish-to-github-components.yml"
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "main"
    file: "publish-to-github.yml"

stages:
  - test
  - build
  - deploy-prod
  
# run check (R CMD check of R package)
r-devtools-check:
  extends:
    - .r-devtools-check
    
r-pkgdown-build-no-commit:
  extends: ".r-pkgdown-build-no-commit"


# rest of the pipeline: remove almost everything except dummy readme and pkgdown site
# then push to github to publish pkgdown site as github pages

remove-stuff-orphan-push:
  extends:
    - .common-settings-publish-to-github
    - .git-setup
    - .orphan-commit-push
  stage: test
  script:
    - !reference [.git-setup, script]
    - git checkout feature-renv-pkgdown
    - ls
    - rm _pkgdown.yml .gitlab-ci.yml .Rbuildignore .Rprofile Dockerfile LICENSE NAMESPACE README.md renv.lock zueridown.Rproj
    - cp dev/dummy_README.md README.md
    - rm -r -f -v dev inst R renv
    - ls -R
    - git add .
    - git commit -m "remove everything including fonts, keep docs, man, and readme"
    - !reference [.orphan-commit-push, script]
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'

    
    