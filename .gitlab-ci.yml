include:
  # use template for gitlab pipeline to check and build
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "feature-build-pkgdown"
    file: "r-check-and-build-packages.yml"
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "main"
    file: "publish-to-github-components.yml"
  - project: "OE-7035/ssz-da/templates/pipeline-templates"
    ref: "main"
    file: "publish-to-github.yml"

stages:
  - test
  - build
  - deploy-prod
  
# run check (R CMD check of R package)
r-devtools-check:
  extends:
    - .r-devtools-check
    
r-pkgdown-build-no-commit:
  extends: ".r-pkgdown-build-no-commit"


# rest of the pipeline: remove almost everything except dummy readme and pkgdown site
# then push to github to publish pkgdown site as github pages

remove-stuff-orphan-push:
  stage: build
  script:
    - rm _pkgdown.yml .gitlab-ci.yml .Rbuildignore .Rprofile DESCRIPTION Dockerfile LICENSE NAMESPACE NEWS.md README.md renv.lock zueridown.Rproj
    - rm -r -f -v inst man R
    - cp dev/dummy_README.md README.md
    - ls -R
    